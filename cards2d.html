<main class="flex-grow-1 min-vh-100">
  <!-- Cards 2D Section -->
 <section class="cards-section py-5">
    <canvas id="cardCanvas"></canvas>
  </section>
</main>

 <!-- Contact Modal -->
<div 
  class="modal fade" 
  id="contactModal" 
  data-bs-backdrop="static" 
  data-bs-keyboard="false" 
  tabindex="-1" 
  aria-labelledby="contactModalLabel" 
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="contactModalLabel">Contact Us</h5>
        <button 
          type="button" 
          class="btn-close" 
          data-bs-dismiss="modal" 
          aria-label="Close"
        ></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body d-flex justify-content-center">
        <form id="christmasContactForm">
          <!-- Name Field -->
          <div class="mb-3">
            <label class="form-label" for="name">Your Name</label>
            <input 
              type="text" 
              class="form-control" 
              id="name" 
              placeholder="Enter your name" 
              required
            />
          </div>
          <!-- Email Field -->
          <div class="mb-3">
            <label class="form-label" for="email">Your Email</label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="Enter your email" 
              required
            />
          </div>
          <!-- Message Field -->
          <div class="mb-3">
            <label class="form-label" for="message">Your Message</label>
            <textarea 
              class="form-control" 
              id="message" 
              rows="3" 
              placeholder="Write your message" 
              required
            ></textarea>
          </div>
          <!-- Submit Button -->
          <div class="text-end">
            <button type="submit" class="btn btn-success">
              Send
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

  <!-- Footer -->
  <footer class="bg-dark text-light mt-auto">
    <div class="container py-5">
      <div class="row align-items-center gy-4">
        <div class="col-md-6 text-center text-md-start">
          <h5 class="footer-title mb-3">🎄 Christmas Cards Hub</h5>
          <p class="footer-text mb-0">A simple and joyful platform to explore, personalize, and share beautiful Christmas cards with your loved ones.</p>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <h5 class="footer-title mb-3">Follow Us</h5>
          <div class="d-flex justify-content-center justify-content-md-end gap-4">
            <a href="https://www.facebook.com/" class="footer-icon" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="https://www.instagram.com/" class="footer-icon" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="https://x.com/" class="footer-icon" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
            <a href="mailto:test@test.test" class="footer-icon" aria-label="Email"><i class="bi bi-envelope"></i></a>
          </div>
        </div>
      </div>
      <hr class="border-secondary my-4">
      <div class="text-center small">© 2025 Christmas Cards Hub. All rights reserved.</div>
    </div>
  </footer>
